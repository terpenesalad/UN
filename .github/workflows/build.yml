name: Build APK

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    working-directory: Unreel-android/unreel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Unreel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Unreel-apk
          path: Unreel-android/unreel/Unreel.apk
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Unreel-android/unreel/Unreel.apk
